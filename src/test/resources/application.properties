# Settings for TESTS only (override src/main/resources/application.properties).
# Tests use the in-memory H2 database -> they run without Docker and start with an empty DB every time.

spring.datasource.url=jdbc:h2:mem:librarytest;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Tables are created by Liquibase (same scripts as the app) -> tests also check that the scripts work.
# Hibernate only validates that tables match the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
