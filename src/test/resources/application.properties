# Settings for TESTS only (override src/main/resources/application.properties).
# Tests use the in-memory H2 database -> they run without Docker and start with an empty DB every time.

spring.datasource.url=jdbc:h2:mem:librarytest;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# create tables at test start, drop them at the end
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
