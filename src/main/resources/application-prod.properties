# ===== PROD profile: production server with real users =====
# Goal: safe + fast. Data is important, nothing may change the DB by accident.

# ---------- Database ----------
# Real passwords must NOT be in git. They come from environment variables set on the server:
#   ${DB_URL:default} = use environment variable DB_URL, or the default after ":" if it is not set
# (defaults point to the Docker DB so you can try the prod profile locally)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/library}
spring.datasource.username=${DB_USERNAME:library}
spring.datasource.password=${DB_PASSWORD:library}

# ---------- JPA / Hibernate ----------
# validate = Hibernate only CHECKS that tables match the entities, never changes them
# (schema changes are done by Liquibase scripts, not automatically)
spring.jpa.hibernate.ddl-auto=validate
# no SQL in the log (slow, huge logs, could leak data)
spring.jpa.show-sql=false

# ---------- Logging ----------
# only important messages (INFO, WARN, ERROR) from our code
logging.level.cz.cvut.fel.sin=INFO
