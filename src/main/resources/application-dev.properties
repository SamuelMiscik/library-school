# ===== DEV profile: development on your PC =====
# Goal: comfortable + easy debugging. Data is not important.

# ---------- Database: PostgreSQL in Docker (see compose.yaml) ----------
# start it first:  docker compose up -d
spring.datasource.url=jdbc:postgresql://localhost:5433/library
spring.datasource.username=library
spring.datasource.password=library

# ---------- JPA / Hibernate ----------
# update = Hibernate creates/changes tables from the entities automatically (handy while developing)
spring.jpa.hibernate.ddl-auto=update
# print every SQL statement, nicely formatted (useful for learning/debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Logging ----------
# DEBUG = a lot of details from our own code (cz.cvut.fel.sin...)
logging.level.cz.cvut.fel.sin=DEBUG
