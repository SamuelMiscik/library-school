# ===== SHARED settings for all environments =====
# Environment-specific settings are in application-<profile>.properties:
#   application-dev.properties   -> your PC (Docker Postgres, SQL logging)
#   application-prod.properties  -> production server (strict, no SQL logging)
# Tests use src/test/resources/application.properties (H2 in memory).

spring.application.name=library

# Which profile is used when you just press Run.
# Override without editing: IntelliJ Run config -> "Active profiles: prod"
#                           or  .\mvnw spring-boot:run -Dspring-boot.run.profiles=prod
spring.profiles.active=dev

# no DB queries while rendering views (same for every environment)
spring.jpa.open-in-view=false
